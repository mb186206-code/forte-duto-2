<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#0f1b2d">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #dfe5ee">
            <tr><td style="background:#172c4a;padding:20px 24px;color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:1px">FORTE DUTO <span style="color:#f2c230;font-size:12px;letter-spacing:3px">GESTÃO</span></td></tr>
            <tr>
              <td style="padding:28px 24px">
                <h1 style="font-size:20px;margin:0 0 12px">Você foi convidado</h1>
                <p style="font-size:15px;line-height:1.5;margin:0 0 24px">Você recebeu acesso ao sistema de gestão da Forte Duto. Clique no botão para criar sua senha e entrar.</p>
                <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/redefinir-senha" style="display:inline-block;background:#172c4a;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:8px">Aceitar convite</a></p>
                <p style="font-size:13px;line-height:1.5;color:#556579;margin:0">Se você não esperava este convite, ignore este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
